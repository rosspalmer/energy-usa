[project]
name = "energy-usa"
version = "0.1.0"
description = "Live and historical US energy data (Postgres + Prefect); Django+Dash web app"
readme = "README.md"
authors = [
    { name = "Ross Palmer", email = "rpalmer@sovrn.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "prefect>=2.0.0,<3",
    "psycopg[binary]>=3.1.0",
    "pydantic-settings>=2.13.1",
]

[project.optional-dependencies]
web = [
    "django>=5.0",
    "django-plotly-dash>=2.0",
    "dash>=2.0",
    "plotly>=5.0",
    "pandas>=2.0",
    "psycopg[binary]>=3.1.0",
    "gunicorn>=22.0",
    "whitenoise>=6.0",
]
notebook = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "jupyter-ai>=2.0",
    "langchain-anthropic>=0.3",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-django>=4.8",
    "django>=5.0",
    "django-plotly-dash>=2.0",
    "dash>=2.0",
    "plotly>=5.0",
    "pandas>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src", "web"]
testpaths = ["tests"]
markers = [
    "integration: tests that require a running Postgres database",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_usa"]
