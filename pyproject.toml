[project]
name = "energy-usa"
version = "0.1.0"
description = "Live and historical US energy data API"
readme = "README.md"
authors = [
    { name = "Ross Palmer", email = "rpalmer@sovrn.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.129.2",
    "httpx>=0.28.1",
    "prefect>=2.0.0,<3",
    "psycopg[binary]>=3.1.0",
    "pydantic-settings>=2.13.1",
    "uvicorn[standard]>=0.41.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_usa"]
