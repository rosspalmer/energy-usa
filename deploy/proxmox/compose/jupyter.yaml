# Docker Compose for the jupyter LXC (energy-jupyter).
# Postgres runs natively on a separate LXC — set POSTGRES_HOST in .env.
#
# Run from repo root:
#   docker compose -f deploy/proxmox/compose/jupyter.yaml up -d --build

services:

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    env_file: .env
    environment:
      INGEST_DATABASE_URL: postgresql://${POSTGRES_USER:-energy}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/ingest
    volumes:
      - ./notebooks:/app/notebooks
    ports:
      - "8888:8888"
    restart: unless-stopped
    # NOTE: No auth token in dev. For production, set a token:
    #   command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888",
    #             "--no-browser", "--allow-root",
    #             "--ServerApp.token=<your-token>"]
