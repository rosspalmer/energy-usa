# Single-machine stack: Postgres, Prefect server, Prefect process worker, Superset BI dashboard.
# Requires .env with EIA_API_KEY and optionally POSTGRES_PASSWORD. Create process work pool once:
#   docker compose run --rm prefect-worker prefect work-pool create process-pool --type process

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-energy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energy}
      POSTGRES_DB: ${POSTGRES_DB:-ingest}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-energy} -d ${POSTGRES_DB:-ingest}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  prefect-server:
    image: prefecthq/prefect:2-python3.12
    command: prefect server start --host 0.0.0.0
    environment:
      # Use Postgres instead of SQLite so run history survives container restarts.
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER:-energy}:${POSTGRES_PASSWORD:-energy}@postgres:5432/prefect
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  prefect-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      EIA_API_KEY: ${EIA_API_KEY}
      INGEST_DATABASE_URL: postgresql://${POSTGRES_USER:-energy}:${POSTGRES_PASSWORD:-energy}@postgres:5432/ingest
      TRANSFORM_DATABASE_URL: postgresql://${POSTGRES_USER:-energy}:${POSTGRES_PASSWORD:-energy}@postgres:5432/transform
      # Store flow results on a persistent volume instead of the ephemeral container layer.
      PREFECT_LOCAL_STORAGE_PATH: /prefect-results
    volumes:
      - prefect_results:/prefect-results
    depends_on:
      prefect-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      replicas: 4

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    env_file: .env
    environment:
      INGEST_DATABASE_URL: postgresql://${POSTGRES_USER:-energy}:${POSTGRES_PASSWORD:-energy}@postgres:5432/ingest
      TRANSFORM_DATABASE_URL: postgresql://${POSTGRES_USER:-energy}:${POSTGRES_PASSWORD:-energy}@postgres:5432/transform
    volumes:
      - ./notebooks:/app/notebooks
    ports:
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy

  pgweb:
    image: sosedoff/pgweb:latest
    environment:
      PGWEB_DATABASE_URL: postgresql://${POSTGRES_USER:-energy}:${POSTGRES_PASSWORD:-energy}@postgres:5432/ingest?sslmode=disable
    ports:
      - "8080:8081"
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot container: upgrades Superset's metadata DB, creates admin user,
  # seeds the EIA Ingest datasource connection.
  # Runs to completion before the main superset service starts.
  superset-init:
    build:
      context: .
      dockerfile: Dockerfile.superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-local-dev-secret-change-me-in-production}
      SUPERSET_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-energy}:${POSTGRES_PASSWORD:-energy}@postgres:5432/superset
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-energy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energy}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@energy.local}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
    volumes:
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./docker/superset/seed_databases.py:/app/pythonpath/seed_databases.py:ro
      - ./docker/superset/init.sh:/app/init.sh:ro
    command: ["bash", "/app/init.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-local-dev-secret-change-me-in-production}
      SUPERSET_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-energy}:${POSTGRES_PASSWORD:-energy}@postgres:5432/superset
    volumes:
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    command: >
      gunicorn
      --bind 0.0.0.0:8088
      --workers 4
      --timeout 120
      "superset.app:create_app()"
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully

volumes:
  postgres_data: {}
  prefect_results: {}
